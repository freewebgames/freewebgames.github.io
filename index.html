<!DOCTYPE html>
<!-- Hi -->
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B2838">
<meta name="msapplication-TileColor" content="#1B2838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/FWG.png">
<link rel="icon" type="image/png" href="/FWG.png">
<link rel="shortcut icon" href="/favicon.ico">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free Web Games</title>

<script src="Ruffle/ruffle.js"></script>

<style>
:root{
    --bg:#101822;
    --panel:#171a21;
    --panel2:#16202d;
    --panel3:#1b2838;
    --line:#000;
    --text:#c7d5e0;
    --muted:#8f98a0;
    --accent:#66c0f4;
    --blue:#417a9b;
    --green1:#75b022;
    --green2:#588a1b;
    --orange1:#d68a2f;
    --orange2:#a8651d;
    --viewer-border:#ffffff;
    --viewer-border-width:3px;
    --viewer-radius:3px;
    --topbar-h:72px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.topbar{
    min-height:72px;
    background:linear-gradient(to bottom, var(--panel3), #171d25);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 28px;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
}

.topbar-upper{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    flex:1;
}

.logo{
    font-size:1.9rem;
    font-weight:700;
    color:#fff;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.menu-button{
    display:none;
    border:none;
    background:var(--blue);
    color:#fff;
    width:42px;
    height:42px;
    border-radius:8px;
    cursor:pointer;
    align-items:center;
    justify-content:center;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
    flex-shrink:0;
    padding:0;
    line-height:0;
}

.menu-button:hover{
    filter:brightness(1.08);
}

.hamburger-icon{
    width:18px;
    height:14px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:stretch;
}

.hamburger-icon span{
    display:block;
    width:100%;
    height:2px;
    border-radius:999px;
    background:#fff;
}

.back-button{
    display:none;
    border:none;
    background:var(--blue);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
    flex-shrink:0;
}

.back-button:hover{
    filter:brightness(1.08);
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
}

.control-button{
    border:none;
    background:var(--blue);
    color:#fff;
    width:42px;
    height:42px;
    border-radius:8px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
    flex-shrink:0;
    padding:0;
    line-height:0;
}

.control-button:hover{
    filter:brightness(1.08);
}

.control-button svg{
    width:20px;
    height:20px;
    display:block;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.keyboard-proxy{
    position:fixed;
    left:-9999px;
    top:0;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

.mobile-search-row{
    display:none;
}

.main{
    display:flex;
    height:calc(100vh - var(--topbar-h));
    min-height:0;
}

.sidebar{
    width:260px;
    background:var(--panel);
    padding:20px;
    border-right:1px solid var(--line);
    overflow-y:auto;
    min-height:0;
}

.sidebar h2{
    font-size:.85rem;
    color:var(--accent);
    margin-bottom:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.cat{
    display:block;
    color:var(--text);
    text-decoration:none;
    padding:10px 12px;
    border-radius:6px;
    margin-bottom:4px;
    cursor:pointer;
    user-select:none;
    transition:background .15s ease, color .15s ease;
}

.cat:hover,
.cat.active{
    background:#2a475e;
    color:#fff;
}

.content{
    flex:1;
    min-width:0;
    overflow-y:auto;
    padding:0 30px 22px;
    min-height:0;
    -webkit-overflow-scrolling:touch;
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:24px;
    position:sticky;
    top:0;
    z-index:25;
    background:var(--bg);
    padding:18px 0 12px;
}

.library-title{
    font-size:2rem;
    font-weight:700;
    color:#fff;
}

.search-wrap{
    position:relative;
    width:min(320px, 100%);
    flex-shrink:0;
}

.search{
    width:100%;
    border:none;
    outline:none;
    background:#316282;
    color:#fff;
    padding:10px 40px 10px 14px;
    border-radius:4px;
    font-size:1rem;
}

.search::placeholder{
    color:#d6e8f3;
}

.search-clear{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:24px;
    height:24px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    color:#fff;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    line-height:1;
    font-size:15px;
    padding:0;
}

.search-clear:hover{
    background:rgba(255,255,255,.24);
}

.search-wrap.has-text .search-clear{
    display:inline-flex;
}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
    gap:22px;
    align-items:start;
}

.game-card{
    background:var(--panel2);
    border:1px solid rgba(0,0,0,.35);
    border-radius:10px;
    overflow:hidden;
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
    cursor:default;
}

.game-card:hover{
    transform:translateY(-4px);
    background:#1d2c3d;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
}

.game-image{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    background:#000;
}

.game-info{
    padding:16px;
}

.game-toprow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px 14px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.game-title{
    flex:1 1 240px;
    min-width:0;
    font-size:1.25rem;
    color:#fff;
    font-weight:700;
    line-height:1.2;
    overflow-wrap:anywhere;
}

.badge-stack{
    display:flex;
    align-items:flex-start;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
    flex:0 1 auto;
    max-width:100%;
}

.input-badge{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 8px;
    border-radius:999px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    color:#b8c7d6;
    font-size:.88rem;
    white-space:nowrap;
    max-width:100%;
}

.mobile-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:0;
    padding:0;
    border:none;
    background:transparent;
    color:#b8c7d6;
    font-size:.88rem;
    white-space:nowrap;
    line-height:1;
}

.input-icons{
    display:flex;
    align-items:center;
    gap:6px;
    line-height:1;
}

.input-icons svg,
.mobile-badge svg{
    width:15px;
    height:15px;
    display:block;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.badge-divider{
    color:#5f6d7a;
    font-size:1rem;
    line-height:1;
    user-select:none;
}

.game-desc{
    color:var(--muted);
    font-size:.95rem;
    line-height:1.45;
    margin-bottom:14px;
}

.action-row{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:flex-start;
    flex-wrap:wrap;
}

.play-button,
.support-button{
    border:none;
    color:#fff;
    padding:10px 18px;
    border-radius:4px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    min-height:38px;
}

.play-button{
    background:linear-gradient(to bottom, var(--green1), var(--green2));
}

.play-button:hover{
    filter:brightness(1.08);
}

.support-button{
    background:linear-gradient(to bottom, var(--orange1), var(--orange2));
}

.support-button:hover{
    filter:brightness(1.08);
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#6b7a88;
    font-size:.9rem;
    padding-bottom:10px;
}

.viewer{
    position:fixed;
    inset:var(--topbar-h) 0 0 0;
    background:#0b1118;
    display:none;
    z-index:20;
    overflow:hidden;
}

/* Shared frame treatment */
.game-shell{
    border:var(--viewer-border-width) solid var(--viewer-border);
    border-radius:var(--viewer-radius);
    background:#000;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    overflow:hidden;
    transform-origin:center center;
    box-sizing:border-box;
}

/* HTML games fill the full viewer with no margin */
.game-shell.html-shell{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.game-shell.html-shell iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#000;
}

/* Flash games keep 800x600 stage and scale as needed */
.game-shell.flash-shell{
    position:absolute;
    left:50%;
    top:50%;
    width:800px;
    height:600px;
    transform:translate(-50%, -50%) scale(1);
}

#ruffleContainer{
    width:100%;
    height:100%;
    display:none;
}

#ruffleContainer > *{
    width:100%;
    height:100%;
    display:block;
    border:none;
    background:#000;
}

.empty-state{
    color:#8f98a0;
    padding:18px 4px;
    font-size:1rem;
}

.backdrop{
    display:none;
}

body.is-playing .header-row{
    display:none;
}

body.is-playing .mobile-search-row{
    display:none;
}

/* Mobile / small tablet layout */
@media (max-width: 767px){
    .topbar{
        min-height:0;
        padding:12px 14px 10px;
    }

    .topbar-upper{
        min-height:0;
        width:100%;
    }

    .menu-button{
        display:inline-flex;
    }

    .logo{
        font-size:1.35rem;
    }

    .back-button{
        padding:9px 12px;
        font-size:.9rem;
    }

    .mobile-search-row{
        display:block;
        width:100%;
        margin-top:10px;
    }

    .mobile-search-row .search-wrap{
        width:100%;
    }

    .sidebar{
        position:fixed;
        top:0;
        left:0;
        bottom:0;
        width:min(84vw, 300px);
        transform:translateX(-102%);
        transition:transform .22s ease;
        z-index:45;
        box-shadow:12px 0 30px rgba(0,0,0,.45);
    }

    body.nav-open .sidebar{
        transform:translateX(0);
    }

    .backdrop{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.55);
        opacity:0;
        pointer-events:none;
        transition:opacity .2s ease;
        z-index:35;
    }

    body.nav-open .backdrop{
        opacity:1;
        pointer-events:auto;
    }

    body.is-playing .menu-button{
        display:none;
    }

    .content{
        padding:0 16px 22px;
    }

    .header-row{
        display:none;
    }

    .games-grid{
        grid-template-columns:1fr;
        gap:16px;
    }

    .game-toprow{
        flex-direction:row;
        align-items:flex-start;
        gap:10px;
        flex-wrap:nowrap;
    }

    .game-title{
        flex:1 1 auto;
        min-width:0;
    }

    .badge-stack{
        justify-content:flex-end;
        flex:0 0 auto;
        max-width:46%;
    }

    .input-badge,
    .mobile-badge{
        width:fit-content;
        max-width:100%;
    }

    .footer{
        margin-top:22px;
    }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-upper">
        <div class="topbar-left">
            <button class="menu-button" id="menuButton" type="button" aria-label="Open categories menu" aria-expanded="false">
                <span class="hamburger-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>
            <div class="logo" id="logoText">Free Web Games</div>
        </div>
        <div class="topbar-right" id="topbarRight">
            <button class="back-button" id="homeButton" type="button">Back To Library</button>
            <button class="control-button keyboard-button" id="keyboardButton" type="button" aria-label="Open keyboard" title="Open keyboard">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <rect x="3" y="6" width="18" height="12" rx="2"></rect>
                    <path d="M6 10h0M9 10h0M12 10h0M15 10h0M18 10h0M6 14h12"></path>
                </svg>
            </button>
            <button class="control-button fullscreen-button" id="fullscreenButton" type="button" aria-label="Fullscreen" title="Fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M8 3H3v5"></path>
                    <path d="M16 3h5v5"></path>
                    <path d="M21 16v5h-5"></path>
                    <path d="M8 21H3v-5"></path>
                </svg>
            </button>
        </div>
    </div>
    <div class="mobile-search-row" id="mobileSearchRow"></div>
</div>

<div class="main">
    <aside class="sidebar" id="sidebar">
        <h2>Categories</h2>
        <a class="cat active" data-cat="all">All Games</a>
        <div id="catList"></div>
    </aside>

    <section class="content">
        <div class="header-row" id="desktopHeaderRow">
            <div class="library-title">Game Library</div>
            <div class="search-wrap" id="searchWrap">
                <input id="searchBox" class="search" type="text" placeholder="Search games..." />
                <button id="searchClear" class="search-clear" type="button" aria-label="Clear search">×</button>
            </div>
        </div>

        <div id="gamesGrid" class="games-grid"></div>
        <div class="footer">Free Web Games © 2026</div>
    </section>
</div>

<div class="backdrop" id="navBackdrop"></div>

<div class="viewer" id="viewer">
    <div id="gameShell" class="game-shell html-shell">
        <iframe id="gameFrame" title="Game frame"></iframe>
        <div id="ruffleContainer"></div>
    </div>
</div>

<textarea id="keyboardProxy" class="keyboard-proxy" aria-hidden="true" tabindex="-1" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>

<script>
let games = [];
let currentCategory = "all";
let currentGameTitle = "";

const grid = document.getElementById("gamesGrid");
const catList = document.getElementById("catList");
const searchBox = document.getElementById("searchBox");
const searchClear = document.getElementById("searchClear");
const searchWrap = document.getElementById("searchWrap");
const viewer = document.getElementById("viewer");
const gameShell = document.getElementById("gameShell");
const frame = document.getElementById("gameFrame");
const ruffleContainer = document.getElementById("ruffleContainer");
const logoText = document.getElementById("logoText");
const homeButton = document.getElementById("homeButton");
const keyboardButton = document.getElementById("keyboardButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const keyboardProxy = document.getElementById("keyboardProxy");
const topbarRight = document.getElementById("topbarRight");
const allCatButton = document.querySelector('.cat[data-cat="all"]');
const menuButton = document.getElementById("menuButton");
const navBackdrop = document.getElementById("navBackdrop");
const mobileSearchRow = document.getElementById("mobileSearchRow");
const desktopHeaderRow = document.getElementById("desktopHeaderRow");
const mobileQuery = window.matchMedia("(max-width: 767px)");
const mobileDeviceQuery = window.matchMedia("(pointer: coarse) and (hover: none)");

let currentMode = "html";
let keyboardOpen = false;

function isMobileLayout() {
    return mobileQuery.matches;
}

function setNavOpen(open) {
    document.body.classList.toggle("nav-open", open);
    menuButton.setAttribute("aria-expanded", open ? "true" : "false");
}

function closeNav() {
    setNavOpen(false);
}

function toggleNav() {
    if (!isMobileLayout()) return;
    setNavOpen(!document.body.classList.contains("nav-open"));
}

function updateSearchClearState() {
    searchWrap.classList.toggle("has-text", searchBox.value.trim().length > 0);
}

function updateTopbarHeight() {
    const topbar = document.querySelector(".topbar");
    if (!topbar) return;
    document.documentElement.style.setProperty("--topbar-h", `${topbar.offsetHeight}px`);
}

function updateTitleText() {
    if (viewer.style.display === "block") {
        logoText.textContent = `Free Web Games | ${currentGameTitle || "Game"}`;
        return;
    }

    if (isMobileLayout()) {
        logoText.textContent = "Free Web Games | Game Library";
    } else {
        logoText.textContent = "Free Web Games";
    }
}

function moveSearchBarForLayout() {
    if (isMobileLayout()) {
        if (searchWrap.parentElement !== mobileSearchRow) {
            mobileSearchRow.appendChild(searchWrap);
        }
    } else {
        if (searchWrap.parentElement !== desktopHeaderRow) {
            desktopHeaderRow.appendChild(searchWrap);
        }
    }
}

function isMobileDevice() {
    return mobileDeviceQuery.matches;
}

function getFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function getFullscreenTarget() {
    return gameShell;
}

function updateFullscreenButtonState() {
    if (!fullscreenButton) return;

    const isFullscreen = getFullscreenElement() === getFullscreenTarget();
    fullscreenButton.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Fullscreen");
    fullscreenButton.title = isFullscreen ? "Exit fullscreen" : "Fullscreen";
}

async function toggleFullscreen() {
    const target = getFullscreenTarget();
    if (!target) return;

    try {
        if (getFullscreenElement()) {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                await document.webkitExitFullscreen();
            }
            return;
        }

        if (target.requestFullscreen) {
            await target.requestFullscreen();
        } else if (target.webkitRequestFullscreen) {
            await target.webkitRequestFullscreen();
        }
    } catch (err) {
        console.error(err);
    }
}

function isHtmlGameOpen() {
    return viewer.style.display === "block" && currentMode === "html";
}

function codeForKey(key) {
    if (key === " ") return "Space";
    if (key.length === 1) {
        const upper = key.toUpperCase();
        if (upper >= "A" && upper <= "Z") return `Key${upper}`;
        if (upper >= "0" && upper <= "9") return `Digit${upper}`;
    }

    const map = {
        Enter: "Enter",
        Backspace: "Backspace",
        Tab: "Tab",
        Escape: "Escape",
        Delete: "Delete",
        ArrowLeft: "ArrowLeft",
        ArrowRight: "ArrowRight",
        ArrowUp: "ArrowUp",
        ArrowDown: "ArrowDown",
        Home: "Home",
        End: "End",
        PageUp: "PageUp",
        PageDown: "PageDown"
    };

    return map[key] || "";
}

function legacyKeyCodeForKey(key) {
    if (key === " ") return 32;
    if (key.length === 1) return key.toUpperCase().charCodeAt(0);

    const map = {
        Enter: 13,
        Backspace: 8,
        Tab: 9,
        Escape: 27,
        Delete: 46,
        ArrowLeft: 37,
        ArrowUp: 38,
        ArrowRight: 39,
        ArrowDown: 40,
        Home: 36,
        End: 35,
        PageUp: 33,
        PageDown: 34
    };

    return map[key] || 0;
}

function getKeyboardTargets() {
    const targets = [];

    try {
        if (frame.contentWindow) targets.push(frame.contentWindow);
    } catch (err) {
        // cross-origin or not ready
    }

    try {
        if (frame.contentDocument) targets.push(frame.contentDocument);
    } catch (err) {
        // cross-origin or not ready
    }

    targets.push(window);
    return targets;
}

function dispatchKeyToTargets(type, key, sourceEvent = {}) {
    const eventInit = {
        key,
        code: sourceEvent.code || codeForKey(key),
        location: sourceEvent.location || 0,
        ctrlKey: !!sourceEvent.ctrlKey,
        shiftKey: !!sourceEvent.shiftKey,
        altKey: !!sourceEvent.altKey,
        metaKey: !!sourceEvent.metaKey,
        repeat: !!sourceEvent.repeat,
        bubbles: true,
        cancelable: true,
        composed: true,
        keyCode: sourceEvent.keyCode || legacyKeyCodeForKey(key),
        charCode: sourceEvent.charCode || (type === "keypress" && key.length === 1 ? key.charCodeAt(0) : 0),
        which: sourceEvent.which || legacyKeyCodeForKey(key)
    };

    const targets = getKeyboardTargets();
    for (const target of targets) {
        try {
            const event = new KeyboardEvent(type, eventInit);
            target.dispatchEvent(event);
        } catch (err) {
            // ignore
        }
    }
}

function dispatchTextToGame(text) {
    for (const char of text) {
        dispatchKeyToTargets("keydown", char, { keyCode: legacyKeyCodeForKey(char), which: legacyKeyCodeForKey(char), charCode: 0 });
        dispatchKeyToTargets("keypress", char, { keyCode: legacyKeyCodeForKey(char), which: legacyKeyCodeForKey(char), charCode: char.charCodeAt(0) });
        dispatchKeyToTargets("keyup", char, { keyCode: legacyKeyCodeForKey(char), which: legacyKeyCodeForKey(char), charCode: 0 });
    }
}

function updateControlVisibility() {
    const playing = document.body.classList.contains("is-playing");
    const showKeyboard = playing && isMobileDevice() && isHtmlGameOpen();
    const showHome = playing;
    const showFullscreen = playing;

    topbarRight.style.display = playing ? "flex" : "none";
    homeButton.style.display = showHome ? "inline-flex" : "none";
    keyboardButton.style.display = showKeyboard ? "inline-flex" : "none";
    fullscreenButton.style.display = showFullscreen ? "inline-flex" : "none";
    if (!showKeyboard) {
        keyboardOpen = false;
        keyboardProxy.value = "";
    }
    updateFullscreenButtonState();
}

function openMobileKeyboard() {
    if (!isMobileDevice() || !isHtmlGameOpen()) return;

    keyboardOpen = true;
    keyboardProxy.value = "";
    try {
        keyboardProxy.focus({ preventScroll: true });
    } catch (err) {
        keyboardProxy.focus();
    }
}

function handleKeyboardProxyInput() {
    if (!isHtmlGameOpen()) {
        keyboardProxy.value = "";
        return;
    }

    const value = keyboardProxy.value;
    if (value) {
        dispatchTextToGame(value);
        keyboardProxy.value = "";
    }

    if (keyboardOpen) {
        window.setTimeout(() => {
            if (!isHtmlGameOpen()) return;
            if (document.activeElement === keyboardProxy) return;
            try {
                keyboardProxy.focus({ preventScroll: true });
            } catch (err) {
                keyboardProxy.focus();
            }
        }, 0);
    }
}

function parseConfig(text) {
    const blocks = text
        .trim()
        .split(/\n\s*\n/)
        .filter(Boolean);

    const knownKeys = new Set([
        "title",
        "url",
        "img",
        "desc",
        "cat",
        "input",
        "creator_name",
        "creator_url",
        "mobile"
    ]);

    return blocks.map(block => {
        const obj = {};

        block.split("\n").forEach(line => {
            const idx = line.indexOf("|");
            if (idx === -1) return;

            const left = line.slice(0, idx).trim();
            const right = line.slice(idx + 1).trim();
            const leftKey = left.toLowerCase();
            const rightKey = right.toLowerCase();

            if (knownKeys.has(leftKey)) {
                obj[leftKey] = right;
                return;
            }

            if (knownKeys.has(rightKey) && !knownKeys.has(leftKey)) {
                obj[rightKey] = left;
                return;
            }

            obj[leftKey] = right;
        });

        obj.cat = (obj.cat || "")
            .split(",")
            .map(s => s.trim())
            .filter(Boolean);

        obj.input = (obj.input || "keyboard+mouse").trim().toLowerCase();
        obj.creator_name = (obj.creator_name || "").trim();
        obj.creator_url = (obj.creator_url || "").trim();
        obj.mobile = (obj.mobile || "").trim().toLowerCase();

        return obj;
    }).filter(g => g.title && g.url);
}

function iconSVG(kind) {
    const common = `stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false"`;
    if (kind === "keyboard") {
        return `<svg ${common}><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M6 10h0M9 10h0M12 10h0M15 10h0M18 10h0M6 14h12"></path></svg>`;
    }
    if (kind === "mouse") {
        return `<svg ${common}><path d="M12 3c3 0 5 2 5 5v8c0 3-2 5-5 5s-5-2-5-5V8c0-3 2-5 5-5z"></path><path d="M12 7v4"></path></svg>`;
    }
    if (kind === "touch") {
        return `<svg ${common}><path d="M8 11.5V7.5a1.5 1.5 0 0 1 3 0V12"></path><path d="M11 12V6.8a1.2 1.2 0 0 1 2.4 0V12"></path><path d="M13.4 12V8a1.1 1.1 0 0 1 2.2 0v4"></path><path d="M15.6 12V9.2a1 1 0 0 1 2 0V15c0 3-2 5-5 5h-1.5c-2.8 0-4.1-1.2-5.2-3.2L5 15.3"></path></svg>`;
    }
    return `<svg ${common}><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>`;
}

function mobilePhoneSVG() {
    return `
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="7" y="3" width="10" height="18" rx="2"></rect>
            <path d="M10 6h4"></path>
            <path d="M11.5 18h1"></path>
        </svg>
    `;
}

function inputMeta(type) {
    const map = {
        keyboard: { icons: ["keyboard"] },
        mouse: { icons: ["mouse"] },
        touch: { icons: ["touch"] },
        "keyboard+mouse": { icons: ["keyboard", "mouse"] },
        "keyboard+touch": { icons: ["keyboard", "touch"] },
        "mouse+touch": { icons: ["mouse", "touch"] },
        all: { icons: ["keyboard", "mouse", "touch"] }
    };

    return map[type] || {
        icons: ["touch"]
    };
}

function uniqueCategories() {
    return [...new Set(games.flatMap(g => Array.isArray(g.cat) ? g.cat : []))];
}

function gameMatchesCategory(game, category) {
    if (category === "all") return true;
    return Array.isArray(game.cat) && game.cat.includes(category);
}

function gameMatchesSearch(game, term) {
    if (!term) return true;
    const title = (game.title || "").toLowerCase();
    const desc = (game.desc || "").toLowerCase();
    return title.includes(term) || desc.includes(term);
}

function setActiveCategory(category) {
    document.querySelectorAll(".cat").forEach(el => el.classList.remove("active"));
    const active = document.querySelector(`.cat[data-cat="${category}"]`);
    if (active) active.classList.add("active");
}

function renderCategories() {
    catList.innerHTML = "";

    uniqueCategories().forEach(category => {
        const a = document.createElement("a");
        a.className = "cat";
        a.dataset.cat = category;
        a.textContent = category;
        a.addEventListener("click", () => {
            currentCategory = category;
            setActiveCategory(category);
            renderGames();
            if (isMobileLayout()) closeNav();
        });
        catList.appendChild(a);
    });
}

function renderGames() {
    const term = searchBox.value.trim().toLowerCase();
    grid.innerHTML = "";

    const filtered = games.filter(g =>
        gameMatchesCategory(g, currentCategory) &&
        gameMatchesSearch(g, term)
    );

    if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No games match the current filter.";
        grid.appendChild(empty);
        return;
    }

    filtered.forEach(g => {
        const meta = inputMeta(g.input);

        const mobileFriendly = g.mobile === "yes";
        const showMobileTouchIcon = mobileFriendly && isMobileDevice();

        const badgeIcons = [...meta.icons];
        if (showMobileTouchIcon && !badgeIcons.includes("touch")) {
            badgeIcons.push("touch");
        }

        const card = document.createElement("div");
        card.className = "game-card";

        const supportButtonHTML = g.creator_url
            ? `<a class="support-button" href="${g.creator_url}" target="_blank" rel="noopener noreferrer">
                   Support ${g.creator_name ? g.creator_name : "Creator"}
               </a>`
            : "";

        const inputBadgeHTML = `
            <div class="input-badge ${mobileFriendly ? "has-mobile" : ""}"
                 title="${[
                    ...badgeIcons,
                    mobileFriendly ? "mobile friendly" : ""
                 ].filter(Boolean).join(", ")}">
                <span class="input-icons" aria-hidden="true">
                    ${badgeIcons.map(i => iconSVG(i)).join("")}
                </span>
                ${
                    mobileFriendly
                        ? `
                            <span class="badge-divider" aria-hidden="true">•</span>
                            <span class="mobile-badge" title="Mobile friendly" aria-hidden="true">
                                ${mobilePhoneSVG()}
                            </span>
                        `
                        : ""
                }
            </div>
        `;

        card.innerHTML = `
            <img class="game-image" src="${g.img || ""}" alt="${g.title || ""}">
            <div class="game-info">
                <div class="game-toprow">
                    <div class="game-title">${g.title || ""}</div>

                    <div class="badge-stack">
                        ${inputBadgeHTML}
                    </div>
                </div>

                <div class="game-desc">${g.desc || ""}</div>

                <div class="action-row">
                    <button class="play-button" type="button">Play</button>
                    ${supportButtonHTML}
                </div>
            </div>
        `;

        card.querySelector(".play-button").addEventListener("click", () => {
            openGame(g.url, g.title || "Game");
        });

        grid.appendChild(card);
    });
}

function isFlashGame(url) {
    return /\.swf(\?|#|$)/i.test(url);
}

function clearViewerContent() {
    frame.src = "";
    ruffleContainer.innerHTML = "";
}

const FLASH_BASE_W = 800;
const FLASH_BASE_H = 600;

let flashResizeObserver = null;

function calculateFlashScale() {
    const availableW = viewer.clientWidth;
    const availableH = viewer.clientHeight;

    const scaleX = availableW / FLASH_BASE_W;
    const scaleY = availableH / FLASH_BASE_H;

    const scale = Math.min(scaleX, scaleY);

    return Math.min(scale, 3);
}

function applyFlashScale() {
    if (currentMode !== "flash") return;

    const scale = calculateFlashScale();
    gameShell.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function setupFlashResizeTracking() {
    if (flashResizeObserver) return;

    flashResizeObserver = new ResizeObserver(() => {
        applyFlashScale();
    });

    flashResizeObserver.observe(viewer);
}

function openGame(url, title) {
    viewer.style.display = "block";
    homeButton.style.display = "block";
    currentGameTitle = title || "Game";
    document.body.classList.add("is-playing");
    closeNav();
    updateTitleText();

    clearViewerContent();

    if (isFlashGame(url) && window.RufflePlayer) {
        currentMode = "flash";
        gameShell.classList.remove("html-shell");
        gameShell.classList.add("flash-shell");

        frame.style.display = "none";
        ruffleContainer.style.display = "block";

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";

        ruffleContainer.appendChild(player);
        player.load(url);

        setupFlashResizeTracking();
        requestAnimationFrame(() => applyFlashScale());
    } else {
        currentMode = "html";
        gameShell.classList.remove("flash-shell");
        gameShell.classList.add("html-shell");

        ruffleContainer.style.display = "none";
        frame.style.display = "block";
        gameShell.style.transform = "none";
        frame.src = url;
    }

    updateTopbarHeight();
    updateControlVisibility();
}

async function closeGame() {
    if (getFullscreenElement()) {
        try {
            if (document.exitFullscreen) {
                await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                await document.webkitExitFullscreen();
            }
        } catch (err) {
            // ignore
        }
    }

    viewer.style.display = "none";
    clearViewerContent();
    keyboardProxy.blur();
    keyboardProxy.value = "";

    frame.style.display = "block";
    ruffleContainer.style.display = "none";
    gameShell.style.transform = "none";
    gameShell.classList.remove("flash-shell");
    gameShell.classList.add("html-shell");

    homeButton.style.display = "none";
    currentGameTitle = "";
    document.body.classList.remove("is-playing");
    closeNav();
    currentMode = "html";
    updateTitleText();
    updateTopbarHeight();
    updateControlVisibility();
    if (flashResizeObserver) {
        flashResizeObserver.disconnect();
        flashResizeObserver = null;
    }
}

function syncResponsiveState() {
    moveSearchBarForLayout();
    updateTitleText();
    updateSearchClearState();
    updateTopbarHeight();
    updateControlVisibility();

    if (!isMobileLayout()) {
        closeNav();
    }

    if (viewer.style.display !== "block") {
        document.body.classList.remove("is-playing");
    }
}

homeButton.addEventListener("click", closeGame);
menuButton.addEventListener("click", toggleNav);
navBackdrop.addEventListener("click", closeNav);
searchBox.addEventListener("input", () => {
    updateSearchClearState();
    renderGames();
});
searchClear.addEventListener("click", () => {
    searchBox.value = "";
    updateSearchClearState();
    renderGames();
    searchBox.focus();
});
allCatButton.addEventListener("click", () => {
    currentCategory = "all";
    setActiveCategory("all");
    renderGames();
});
window.addEventListener("resize", syncResponsiveState);
mobileQuery.addEventListener("change", syncResponsiveState);
mobileDeviceQuery.addEventListener("change", () => {
    renderGames();
    syncResponsiveState();
});
document.addEventListener("fullscreenchange", updateFullscreenButtonState);
document.addEventListener("webkitfullscreenchange", updateFullscreenButtonState);
fullscreenButton.addEventListener("click", toggleFullscreen);
keyboardButton.addEventListener("click", openMobileKeyboard);
keyboardProxy.addEventListener("focus", () => {
    keyboardOpen = true;
});
keyboardProxy.addEventListener("input", handleKeyboardProxyInput);
keyboardProxy.addEventListener("blur", () => {
    keyboardOpen = false;
});

async function loadConfig() {
    try {
        const res = await fetch("config.txt", { cache: "no-store" });
        if (!res.ok) throw new Error(`config.txt load failed: ${res.status}`);

        const text = await res.text();
        games = parseConfig(text);

        renderCategories();
        renderGames();
        updateSearchClearState();
        syncResponsiveState();
        updateControlVisibility();
    } catch (err) {
        console.error(err);
        grid.innerHTML = `
            <div class="empty-state">
                Could not load config.txt.
            </div>
        `;
        syncResponsiveState();
    }
}

loadConfig();
</script>
