<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free Web Games</title>

<!-- Ruffle (Flash emulator) -->
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

<style>
:root{
    --bg:#101822;
    --panel:#171a21;
    --panel2:#16202d;
    --panel3:#1b2838;
    --line:#000;
    --text:#c7d5e0;
    --muted:#8f98a0;
    --accent:#66c0f4;
    --blue:#417a9b;
    --green1:#75b022;
    --green2:#588a1b;
    --orange1:#d68a2f;
    --orange2:#a8651d;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* Topbar */
.topbar{
    height:72px;
    background:linear-gradient(to bottom, var(--panel3), #171d25);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
}

.logo{
    font-size:1.9rem;
    font-weight:700;
    color:#fff;
}

.back-button{
    display:none;
    border:none;
    background:var(--blue);
    color:#fff;
    padding:10px 18px;
    border-radius:6px;
    font-weight:700;
    cursor:pointer;
}

/* Layout */
.main{display:flex;height:calc(100vh - 72px);}
.sidebar{
    width:260px;
    background:var(--panel);
    padding:20px;
    border-right:1px solid var(--line);
    overflow-y:auto;
}
.sidebar h2{
    font-size:.85rem;
    color:var(--accent);
    margin-bottom:12px;
    text-transform:uppercase;
}

.cat{
    display:block;
    color:var(--text);
    text-decoration:none;
    padding:10px 12px;
    border-radius:6px;
    margin-bottom:4px;
    cursor:pointer;
}
.cat:hover,.cat.active{background:#2a475e;color:#fff;}

.content{
    flex:1;
    overflow-y:auto;
    padding:30px;
}

.header-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:24px;
}

.library-title{font-size:2rem;color:#fff;}
.search{
    width:320px;
    background:#316282;
    border:none;
    padding:10px 14px;
    border-radius:4px;
    color:#fff;
}

/* Grid */
.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
    gap:22px;
}

.game-card{
    background:var(--panel2);
    border-radius:10px;
    overflow:hidden;
}

.game-image{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#000;
}

.game-info{padding:16px;}
.game-title{color:#fff;font-size:1.2rem;font-weight:700;}

.game-desc{color:var(--muted);margin:10px 0;}

.play-button{
    background:linear-gradient(to bottom, var(--green1), var(--green2));
    border:none;
    color:#fff;
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
}

/* Viewer */
.viewer{
    position:fixed;
    inset:72px 0 0 0;
    background:#000;
    display:none;
    z-index:20;
}

/* iframe games */
.viewer iframe{
    width:100%;
    height:100%;
    border:none;
}

/* Ruffle container */
#ruffleContainer{
    width:100%;
    height:100%;
}

/* Mobile */
@media (max-width:900px){
    .sidebar{display:none;}
    .games-grid{grid-template-columns:1fr;}
    .search{width:100%;}
}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo" id="logoText">Free Web Games</div>
    <button class="back-button" id="homeButton">Back To Library</button>
</div>

<div class="main">
    <aside class="sidebar">
        <h2>Categories</h2>
        <a class="cat active" data-cat="all">All Games</a>
        <div id="catList"></div>
    </aside>

    <section class="content">
        <div class="header-row">
            <div class="library-title">Game Library</div>
            <input id="searchBox" class="search" placeholder="Search games..." />
        </div>

        <div id="gamesGrid" class="games-grid"></div>
    </section>
</div>

<!-- Viewer -->
<div class="viewer" id="viewer">
    <iframe id="gameFrame"></iframe>
    <div id="ruffleContainer"></div>
</div>

<script>
let games = [];
let currentCategory = "all";

const grid = document.getElementById("gamesGrid");
const catList = document.getElementById("catList");
const searchBox = document.getElementById("searchBox");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("gameFrame");
const ruffleContainer = document.getElementById("ruffleContainer");
const logoText = document.getElementById("logoText");
const homeButton = document.getElementById("homeButton");

function isSWF(url){
    return url.toLowerCase().includes(".swf");
}

function clearViewer(){
    frame.style.display = "none";
    ruffleContainer.innerHTML = "";
    ruffleContainer.style.display = "none";
}

function openGame(url, title){
    viewer.style.display = "block";
    homeButton.style.display = "block";
    logoText.textContent = `Free Web Games | ${title}`;

    clearViewer();

    if(isSWF(url)){
        // FLASH GAME VIA RUFFLE
        ruffleContainer.style.display = "block";

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";

        ruffleContainer.appendChild(player);
        player.load(url);
    } else {
        // NORMAL WEB GAME
        frame.style.display = "block";
        frame.src = url;
    }
}

function closeGame(){
    viewer.style.display = "none";
    frame.src = "";
    clearViewer();
    homeButton.style.display = "none";
    logoText.textContent = "Free Web Games";
}

/* Config parsing */
function parseConfig(text){
    return text.trim().split(/\n\s*\n/).map(block=>{
        const obj = {};
        block.split("\n").forEach(line=>{
            const i=line.indexOf("|");
            if(i===-1)return;
            obj[line.slice(0,i).trim().toLowerCase()] = line.slice(i+1).trim();
        });
        return obj;
    }).filter(g=>g.title && g.url);
}

function renderGames(){
    const term = searchBox.value.toLowerCase();
    grid.innerHTML = "";

    games
    .filter(g => g.title.toLowerCase().includes(term))
    .forEach(g=>{
        const card = document.createElement("div");
        card.className="game-card";

        card.innerHTML = `
            <img class="game-image" src="${g.img||""}">
            <div class="game-info">
                <div class="game-title">${g.title}</div>
                <div class="game-desc">${g.desc||""}</div>
                <button class="play-button">Play</button>
            </div>
        `;

        card.querySelector("button").onclick=()=>openGame(g.url,g.title);
        grid.appendChild(card);
    });
}

homeButton.onclick=closeGame;
searchBox.oninput=renderGames;

async function load(){
    const res = await fetch("config.txt");
    games = parseConfig(await res.text());
    renderGames();
}
load();
</script>

</body>
</html>
